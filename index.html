<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121418" />
    <meta
      name="description"
      content="Mihenk, URL ve alan adlarını açıklanabilir bir tehdit skoruyla değerlendiren ve TLP işaretli istihbarat brifingi üreten oltalama tehdit istihbaratı platformudur."
    />
    <link rel="icon" type="image/jpeg" href="/docs/logo.jpg" />
    <title>Mihenk</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('mihenk.theme');
          var pref = raw ? JSON.parse(raw) : 'system';
          var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
